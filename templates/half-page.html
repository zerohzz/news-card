<!DOCTYPE html>
<!-- ⚠️ DENSITY CHECK: 第二梯队页文字内容必须占据视觉面积的 50% 以上 -->
<!-- 参见 references/density-spec.md -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Source+Serif+Pro:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #FAF9F6;
    --bg-card: #FFFFFF;
    --text-primary: #1A1A1A;
    --text-secondary: #6B7280;
    --accent: #D97706;
    --divider: #E5E7EB;
    --font-zh: 'Noto Serif SC', 'Source Han Serif SC', serif;
    --font-en: 'Source Serif Pro', 'Noto Serif', serif;
    --radius-card: 12px;
    --radius-tag: 6px;
  }

  html, body {
    width: 1080px;
    height: 1920px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: var(--bg-primary);
    font-family: var(--font-zh);
    color: var(--text-primary);
  }

  .page {
    width: 1080px;
    height: 1920px;
    display: flex;
    flex-direction: column;
    padding: 60px 56px 40px;
    box-sizing: border-box;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
  }

  .top-bar .page-num {
    font-family: var(--font-en);
    font-size: 18px;
    color: var(--text-secondary);
  }

  .top-bar .date {
    font-family: var(--font-en);
    font-size: 18px;
    color: var(--text-secondary);
  }

  .stories {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .story {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 36px 0;
  }

  .story + .story {
    border-top: 2px solid var(--divider);
  }

  .story .category-tag {
    display: inline-block;
    padding: 8px 20px;
    border-radius: var(--radius-tag);
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 20px;
    align-self: flex-start;
  }

  .story .headline-zh {
    font-size: 28px;
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 10px;
  }

  .story .headline-en {
    font-size: 18px;
    font-family: var(--font-en);
    font-weight: 600;
    color: var(--text-secondary);
    line-height: 1.4;
    margin-bottom: 24px;
  }

  .story .summary {
    font-size: 22px;
    line-height: 1.7;
    flex: 1;
    margin-bottom: 20px;
  }

  .story .source-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 16px;
  }

  .story .source-bar .source-name {
    font-family: var(--font-en);
    font-weight: 600;
  }

  .story .source-bar .source-url {
    color: var(--text-secondary);
    font-family: var(--font-en);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .footer {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--divider);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
    color: var(--text-secondary);
  }

  .footer .brand {
    font-weight: 700;
    color: var(--accent);
    font-family: var(--font-en);
  }
</style>
</head>
<body>
<div class="page">
  <div class="top-bar">
    <span class="page-num">{{page_num}} / 8</span>
    <span class="date">{{date}}</span>
  </div>

  <div class="stories">
    {{#each stories}}
    <div class="story">
      <div class="category-tag" style="background: {{color_tag}}">{{category}}</div>
      <div class="headline-zh">{{headline_zh}}</div>
      <div class="headline-en">{{headline_en}}</div>
      <div class="summary">{{summary_zh}}</div>
      <div class="source-bar">
        <span class="source-name">{{source}}</span>
        <span class="source-url">{{source_url}}</span>
      </div>
    </div>
    {{/each}}
  </div>

  <div class="footer">
    <span class="brand">News Card</span>
    <span>{{date}} · 第 {{issue}} 期</span>
  </div>
</div>
</body>
</html>

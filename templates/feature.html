<!DOCTYPE html>
<!-- ⚠️ DENSITY CHECK: 第一梯队页文字内容必须占据视觉面积的 55% 以上 -->
<!-- 参见 references/density-spec.md -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Source+Serif+Pro:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #FAF9F6;
    --bg-card: #FFFFFF;
    --text-primary: #1A1A1A;
    --text-secondary: #6B7280;
    --accent: #D97706;
    --divider: #E5E7EB;
    --font-zh: 'Noto Serif SC', 'Source Han Serif SC', serif;
    --font-en: 'Source Serif Pro', 'Noto Serif', serif;
    --radius-card: 12px;
    --radius-tag: 6px;
  }

  html, body {
    width: 1080px;
    height: 1920px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: var(--bg-primary);
    font-family: var(--font-zh);
    color: var(--text-primary);
  }

  .page {
    width: 1080px;
    height: 1920px;
    display: flex;
    flex-direction: column;
    padding: 60px 56px 40px;
    box-sizing: border-box;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
  }

  .top-bar .page-num {
    font-family: var(--font-en);
    font-size: 18px;
    color: var(--text-secondary);
    letter-spacing: 1px;
  }

  .top-bar .date {
    font-family: var(--font-en);
    font-size: 18px;
    color: var(--text-secondary);
  }

  .category-tag {
    display: inline-block;
    padding: 10px 24px;
    border-radius: var(--radius-tag);
    color: #FFFFFF;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 28px;
  }

  .headline-zh {
    font-size: 40px;
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 16px;
  }

  .headline-en {
    font-size: 22px;
    font-family: var(--font-en);
    font-weight: 600;
    color: var(--text-secondary);
    line-height: 1.4;
    margin-bottom: 36px;
  }

  .content-divider {
    width: 80px;
    height: 3px;
    background: var(--accent);
    margin-bottom: 36px;
    border-radius: 2px;
  }

  .summary {
    font-size: 24px;
    line-height: 1.8;
    margin-bottom: 40px;
    flex: 1;
  }

  .highlight-box {
    background: var(--bg-card);
    border-left: 5px solid var(--accent);
    border-radius: 0 var(--radius-card) var(--radius-card) 0;
    padding: 28px 32px;
    margin-bottom: 40px;
  }

  .highlight-box .label {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 12px;
    font-family: var(--font-en);
  }

  .highlight-box .text {
    font-size: 22px;
    line-height: 1.6;
    font-weight: 600;
  }

  .source-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 0;
    border-top: 1px solid var(--divider);
    margin-bottom: 20px;
  }

  .source-bar .source-name {
    font-size: 20px;
    font-family: var(--font-en);
    font-weight: 600;
  }

  .source-bar .source-url {
    font-size: 16px;
    color: var(--text-secondary);
    font-family: var(--font-en);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .related-sources {
    font-size: 16px;
    color: var(--text-secondary);
    margin-bottom: 24px;
  }

  .footer {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--divider);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
    color: var(--text-secondary);
  }

  .footer .brand {
    font-weight: 700;
    color: var(--accent);
    font-family: var(--font-en);
  }
</style>
</head>
<body>
<div class="page">
  <div class="top-bar">
    <span class="page-num">{{page_num}} / 8</span>
    <span class="date">{{date}}</span>
  </div>

  <div class="category-tag" style="background: {{color_tag}}">{{category}}</div>

  <div class="headline-zh">{{headline_zh}}</div>
  <div class="headline-en">{{headline_en}}</div>

  <div class="content-divider"></div>

  <div class="summary">{{summary_zh}}</div>

  <div class="highlight-box">
    <div class="label">Key Insight</div>
    <div class="text">{{highlight}}</div>
  </div>

  <div class="source-bar">
    <span class="source-name">{{source}}</span>
    <span class="source-url">{{source_url}}</span>
  </div>

  {{#if related_sources}}
  <div class="related-sources">
    同题报道：{{related_sources}}
  </div>
  {{/if}}

  <div class="footer">
    <span class="brand">News Card</span>
    <span>{{date}} · 第 {{issue}} 期</span>
  </div>
</div>
</body>
</html>

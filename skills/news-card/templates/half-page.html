<!DOCTYPE html>
<!-- ⚠️ DENSITY CHECK: 第二梯队页文字内容必须占据视觉面积的 50% 以上 -->
<!-- 参见 references/density-spec.md -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Source+Serif+Pro:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF9F6; --card: #FFFFFF; --text: #1A1A1A; --text-mid: #6B7280;
    --text-dim: #9CA3AF; --accent: #D97706; --divider: #E5E7EB;
    --font-zh: 'Noto Serif SC', 'Source Han Serif SC', 'PingFang SC', serif;
    --font-en: 'Source Serif Pro', Georgia, serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1920px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font-zh);
    color: var(--text);
  }

  .page {
    width: 1080px;
    height: 1920px;
    display: flex;
    flex-direction: column;
    padding: 48px 60px 36px;
    box-sizing: border-box;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .top-bar .page-num {
    font-family: var(--font-en);
    font-size: 18px;
    color: var(--text-mid);
  }

  .top-bar .date {
    font-family: var(--font-en);
    font-size: 18px;
    color: var(--text-mid);
  }

  .stories {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .story {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 36px 0;
    overflow: hidden;
  }

  .story + .story {
    border-top: 2px solid var(--divider);
  }

  .story .category-tag {
    display: inline-block;
    padding: 10px 24px;
    border-radius: 6px;
    color: #FFFFFF;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 20px;
    align-self: flex-start;
  }

  .story .headline-zh {
    font-size: 42px;
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 14px;
  }

  .story .headline-en {
    font-size: 26px;
    font-family: var(--font-en);
    font-weight: 600;
    color: var(--text-mid);
    line-height: 1.4;
    margin-bottom: 24px;
  }

  .story .summary {
    flex: 1;
    font-size: 36px;
    line-height: 1.7;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .story .source-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    margin-top: auto;
    padding-top: 12px;
  }

  .story .source-bar .source-label {
    font-size: 18px;
    color: var(--text-dim);
    font-family: var(--font-zh);
  }

  .story .source-bar .source-name {
    font-family: var(--font-en);
    font-weight: 600;
  }

  .story .source-bar .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-mid);
    flex-shrink: 0;
  }

  .story .source-bar .source-url {
    color: var(--text-mid);
    font-family: var(--font-en);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .footer {
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--divider);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font: 400 18px/1 var(--font-en);
    color: var(--text-dim);
  }

  .footer .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .footer .brand-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
  }

  .footer .brand-name {
    font: 400 24px/1.5 var(--font-zh);
    color: var(--text-mid);
    letter-spacing: 0.03em;
  }

  .footer .date-center { text-align: center; }
  .footer .spacer { width: 80px; }

  .progress-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 0 0 16px;
  }
  .progress-dots .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--divider);
  }
  .progress-dots .dot.active {
    background: var(--accent);
    width: 24px;
    border-radius: 4px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="progress-dots">
    {{#each progress_dots}}<span class="dot{{#if active}} active{{/if}}"></span>{{/each}}
  </div>
  <div class="top-bar">
    <span class="page-num">{{page_num}} / {{total_pages}}</span>
    <span class="date">{{date}}</span>
  </div>

  <div class="stories">
    {{#each stories}}
    <div class="story">
      <div class="category-tag" style="background: {{color_tag}}">{{category}}</div>
      <div class="headline-zh">{{headline_zh}}</div>
      <div class="summary">{{summary_zh}}</div>
      <div class="source-bar">
        <span class="source-name">{{source}}</span>
        <span class="dot"></span>
        <span class="source-url">{{headline_en}}</span>
      </div>
    </div>
    {{/each}}
  </div>

  <div class="footer">
    <div class="brand">
      <img class="brand-avatar" src="file:///C:/Users/AlexHuang/projects/news-card/skills/news-card/assets/Avatar-zz.png" alt="">
      <span class="brand-name">zz 的 AI 日报</span>
    </div>
    <span class="spacer"></span>
  </div>
</div>
</body>
</html>

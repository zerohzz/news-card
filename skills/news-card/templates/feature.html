<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Source+Serif+Pro:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF9F6; --card: #FFFFFF; --text: #1A1A1A; --text-mid: #6B7280;
    --text-dim: #9CA3AF; --accent: #D97706; --divider: #E5E7EB;
    --font-zh: 'Noto Serif SC', 'Source Han Serif SC', 'PingFang SC', serif;
    --font-en: 'Source Serif Pro', Georgia, serif;
  }

  html, body {
    width: 1080px;
    height: 1920px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font-zh);
    color: var(--text);
  }

  /* === Page container === */
  .page {
    width: 1080px;
    height: 1920px;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    position: relative;
  }

  .page::before {
    content: '';
    position: fixed;
    left: 0;
    top: 0;
    width: 6px;
    height: 1920px;
    background: var(--cat-color, var(--accent));
  }

  /* === Header === */
  .header {
    padding: 48px 60px 36px;
    position: relative;
  }

  .header::after {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 0; bottom: 0;
    background: var(--cat-color, var(--accent));
    opacity: 0.06;
    z-index: 0;
  }

  .header > * { position: relative; z-index: 1; }

  .meta-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    font-family: var(--font-en);
    font-size: 18px;
    color: var(--text-mid);
  }

  .cat-tag {
    display: inline-block;
    padding: 10px 28px;
    border-radius: 6px;
    color: #FFFFFF;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 24px;
  }

  .headline-zh {
    font-size: 56px;
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 20px;
  }

  .headline-en {
    font-size: 24px;
    font-family: var(--font-en);
    font-weight: 600;
    color: var(--text-mid);
    line-height: 1.4;
    margin-bottom: 0;
  }

  /* === Content === */
  .content {
    flex: 1;
    padding: 36px 60px;
    overflow: hidden;
  }

  .accent-rule {
    width: 52px;
    height: 3px;
    background: var(--accent);
    margin-bottom: 28px;
    border-radius: 2px;
  }

  /* Content typography */
  .content p {
    font: 400 36px/1.7 var(--font-zh);
    margin: 0 0 28px;
  }

  .content strong {
    font-weight: 600;
  }

  .content h3 {
    font: 700 36px/1.3 var(--font-zh);
    margin: 28px 0 16px;
  }

  .content ul {
    list-style: none;
    padding: 0;
    margin: 0 0 28px;
  }

  .content ul li {
    font-size: 32px;
    line-height: 1.7;
    padding-left: 24px;
    position: relative;
  }

  .content ul li::before {
    content: '·';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-weight: 700;
  }

  .content blockquote {
    padding-left: 24px;
    border-left: 3px solid var(--divider);
    margin: 0 0 28px;
  }

  .content blockquote p {
    font: 300 36px/1.7 var(--font-zh);
    color: var(--text-mid);
  }

  .content blockquote cite {
    font-size: 24px;
    color: var(--text-dim);
    font-style: normal;
  }

  .content .highlight {
    font: 500 40px/1.55 var(--font-zh);
    border-left: 3px solid var(--cat-color, var(--accent));
    padding: 14px 0 14px 24px;
    margin: 28px 0;
  }

  .content .callout {
    background: var(--card);
    border-radius: 10px;
    padding: 20px 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    margin: 0 0 28px;
  }

  .content .callout strong {
    font-size: 28px;
  }

  .content .callout p {
    font-size: 28px;
    color: var(--text-mid);
    margin: 0;
  }

  .content .divider {
    height: 1px;
    background: var(--divider);
    margin: 28px 0;
  }

  /* === Component: data-row / data-highlight === */
  .content .data-row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin: 16px 0 24px;
  }

  .content .data-highlight {
    display: inline-flex;
    flex-direction: column;
    background: var(--card);
    border-radius: 12px;
    padding: 20px 32px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }

  .content .data-highlight .data-value {
    font-weight: 900;
    font-size: 48px;
    color: var(--cat-color, var(--accent));
  }

  .content .data-highlight .data-label {
    font-size: 20px;
    color: var(--text-mid);
  }

  /* === Component: timeline === */
  .content .timeline {
    margin: 20px 0;
  }

  .content .timeline-item {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
  }

  .content .timeline-marker {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--cat-color, var(--accent));
    color: #FFFFFF;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .content .timeline-content strong {
    font-size: 32px;
    line-height: 1.4;
  }

  .content .timeline-content p {
    font-size: 28px;
    line-height: 1.6;
    color: var(--text-mid);
    margin-bottom: 0;
  }

  /* === Component: compare-grid === */
  .content .compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin: 20px 0;
  }

  .content .compare-item {
    padding: 20px;
    border-radius: 10px;
  }

  .content .compare-pro {
    background: #ECFDF5;
  }

  .content .compare-con {
    background: #FEF2F2;
  }

  .content .compare-item strong {
    font-size: 28px;
  }

  .content .compare-item p {
    font-size: 28px;
    margin-bottom: 0;
  }

  /* === Component: key-points === */
  .content .key-points {
    list-style: none;
    padding: 0;
    margin: 0 0 28px;
  }

  .content .key-points li {
    font-size: 32px;
    line-height: 1.6;
    padding-left: 24px;
    position: relative;
  }

  .content .key-points li::before {
    content: '·';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-weight: 700;
  }

  /* === Footer === */
  .footer {
    flex-shrink: 0;
    padding: 0 60px 36px;
  }

  .source-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 0;
    border-top: 1px solid var(--divider);
    font-family: var(--font-en);
  }

  .source-bar .source-name {
    font-size: 22px;
    font-weight: 700;
  }

  .source-bar .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-mid);
  }

  .source-bar .source-url {
    font-size: 17px;
    color: var(--text-mid);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .brand-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 12px;
    font-size: 16px;
    color: var(--text-mid);
  }

  .brand-bar .brand {
    font-weight: 700;
    color: var(--accent);
    font-family: var(--font-en);
  }
</style>
</head>
<body>
<div class="page" style="--cat-color: {{color_tag}}">
  <div class="header">
    <div class="meta-bar">
      <span>{{page_num}} / 8</span>
      <span>{{date}}</span>
    </div>
    <div class="cat-tag" style="background: {{color_tag}}">{{category}}</div>
    <div class="headline-zh">{{headline_zh}}</div>
    <div class="headline-en">{{headline_en}}</div>
  </div>

  <div class="content">
    <div class="accent-rule"></div>
    {{{content_html}}}
  </div>

  <div class="footer">
    <div class="source-bar">
      <span class="source-name">{{source}}</span>
      <span class="dot"></span>
      <span class="source-url">{{source_url}}</span>
    </div>
    {{#if related_sources}}
    <div style="font-size: 17px; color: var(--text-mid); padding: 8px 0 0; line-height: 1.5;">同题报道：{{related_sources}}</div>
    {{/if}}
    <div class="brand-bar">
      <span class="brand">News Card</span>
      <span>{{date}} · 第 {{issue}} 期</span>
    </div>
  </div>
</div>
</body>
</html>
